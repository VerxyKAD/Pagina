<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseño Avanzado de Páginas Web</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    min-height: 100vh;
    background: #f2f2f2;
  }
  nav {
    width: 250px;
    background: #7a1f2b;
    color: white;
    padding: 20px 0;
    flex-shrink: 0;
  }
  nav h2 { font-size: 16px; margin: 0 20px 6px; line-height: 1.3; }
  nav p { margin: 0 20px 16px; font-size: 13px; opacity: .85; }
  nav a {
    display: block;
    padding: 14px 20px;
    color: white;
    text-decoration: none;
    border-left: 5px solid transparent;
    cursor: pointer;
    user-select: none;
  }
  nav a:hover { background: #962a39; }
  nav a.activo {
    background: #962a39;
    border-left-color: #ffd54f;
    font-weight: bold;
  }
  main { flex: 1; padding: 30px; }
  .tarjeta {
    background: white;
    max-width: 650px;
    padding: 25px 30px;
    border-left: 6px solid #7a1f2b;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .tarjeta h2 { color: #7a1f2b; margin-top: 0; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input {
    font-size: 16px;
    padding: 9px;
    width: 100%;
    max-width: 280px;
    margin-top: 5px;
    border: 1px solid #aaa;
    border-radius: 4px;
  }
  button {
    font-size: 16px;
    padding: 10px 18px;
    margin-top: 18px;
    background: #7a1f2b;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #962a39; }
  .resultado { font-size: 20px; margin-top: 20px; line-height: 1.6; }
  .resultado b { color: #7a1f2b; }
  .error { color: #c62828; font-size: 18px; }
  .seccion { display: none; }
  .seccion.visible { display: block; }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    nav { width: 100%; padding: 10px 0; }
  }
</style>
</head>
<body>

<nav>
  <h2>Diseño Avanzado de Páginas Web</h2>
  <p>Funciones que devuelven un resultado</p>
  <a id="menu1" class="activo">Área del círculo</a>
  <a id="menu2">Índice de Masa Corporal</a>
</nav>

<main>

  <!-- Área del círculo -->
  <div id="seccion1" class="seccion visible">
    <div class="tarjeta">
      <h2>Funciones que devuelven resultados</h2>
      <p>Área del círculo</p>
      <label for="radio">Valor del radio del círculo:</label>
      <input type="number" id="radio" min="0" step="any" placeholder="Escribe un número">
      <br>
      <button id="btnArea">Calcular área</button>
      <div class="resultado" id="resultado1"></div>
    </div>
  </div>

  <!-- Índice de Masa Corporal -->
  <div id="seccion2" class="seccion">
    <div class="tarjeta">
      <h2>Funciones definidas por el usuario</h2>
      <p>Índice de Masa Corporal</p>
      <label for="peso">¿Cuánto pesas? (en kg):</label>
      <input type="number" id="peso" min="0" step="any" placeholder="Ej. 70">
      <label for="altura">¿Cuánto mides? (en metros):</label>
      <input type="number" id="altura" min="0" step="any" placeholder="Ej. 1.70">
      <br>
      <button id="btnIMC">Calcular IMC</button>
      <div class="resultado" id="resultado2"></div>
    </div>
  </div>

</main>

<script>
  // ---------- Menú vertical ----------
  function mostrar(numero) {
    for (var i = 1; i <= 2; i++) {
      document.getElementById("seccion" + i).classList.remove("visible");
      document.getElementById("menu" + i).classList.remove("activo");
    }
    document.getElementById("seccion" + numero).classList.add("visible");
    document.getElementById("menu" + numero).classList.add("activo");
  }

  // ---------- Función del área del círculo (devuelve el área) ----------
  function calcularAreaCirculo(radio) {
    var area = Math.PI * radio * radio;   // calcula el área del círculo
    var area2 = area.toFixed(2);          // lo ajusta a 2 decimales
    return area2;                         // aquí regresa el área ya calculada
  }

  function ejercicioAreaCirculo() {
    var radio = parseFloat(document.getElementById("radio").value);
    var salida = document.getElementById("resultado1");
    if (isNaN(radio) || radio < 0) {
      salida.innerHTML = '<span class="error">Escribe un radio válido.</span>';
      return;
    }
    var areaCirculo = calcularAreaCirculo(radio);   // areaCirculo recibe el valor calculado
    salida.innerHTML = "El área del círculo es: <b>" + areaCirculo + "</b>";
  }

  // ---------- Funciones del IMC (devuelven resultados) ----------
  // IMC = peso / altura (al cuadrado)
  function calcularIMC(peso, altura) {
    return peso / Math.pow(altura, 2);
  }

  function clasificarIMC(IMC) {
    if (IMC < 18.5) return "Tienes bajo peso";
    if (IMC < 25)   return "Tienes un peso normal";
    if (IMC < 30)   return "Tienes sobrepeso";
    if (IMC < 35)   return "Tienes obesidad moderada";
    if (IMC < 40)   return "Tienes obesidad severa";
    return "Tienes obesidad muy severa";
  }

  function ejercicioIMC() {
    var peso = parseFloat(document.getElementById("peso").value);
    var altura = parseFloat(document.getElementById("altura").value);
    var salida = document.getElementById("resultado2");
    if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
      salida.innerHTML = '<span class="error">No aplica con ese peso o estatura.</span>';
      return;
    }
    var IMC = calcularIMC(peso, altura);
    salida.innerHTML = "El IMC es <b>" + IMC.toFixed(2) + "</b><br>" + clasificarIMC(IMC);
  }

  // ---------- Eventos ----------
  document.getElementById("menu1").addEventListener("click", function () { mostrar(1); });
  document.getElementById("menu2").addEventListener("click", function () { mostrar(2); });
  document.getElementById("btnArea").addEventListener("click", ejercicioAreaCirculo);
  document.getElementById("btnIMC").addEventListener("click", ejercicioIMC);

  // Enter también calcula
  document.getElementById("radio").addEventListener("keydown", function (e) {
    if (e.key === "Enter") ejercicioAreaCirculo();
  });
  ["peso", "altura"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") ejercicioIMC();
    });
  });
</script>

</body>
</html>
